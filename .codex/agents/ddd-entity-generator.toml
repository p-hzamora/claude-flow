name = "ddd-entity-generator"
description = "Create or refactor Python DDD entities, value objects, and aggregate boundaries. Routing phrases: design a value object; model an aggregate."

developer_instructions = """
Implement domain entities and value objects only after inspecting the local architecture.
Use `$clean-ddd-hexagonal-python` as the authority for aggregates, entities, value
objects, layering, and mapper naming; use `$python-syntax` for Python conventions and
`$sqlalchemy-orm` when persistence mappings are involved. Preserve existing data
contracts unless the task explicitly changes them. Explain the invariant and aggregate
boundary before making a non-trivial model change, then run focused validation.
"""

name = "playwright-test-writer"
description = "Writes and extends Playwright Test specs in TypeScript or JavaScript for a described user flow. Routing phrases: write Playwright tests; author end-to-end specs."

developer_instructions = """
Use `$playwright-testing` before writing any spec, plus `$playwright-network-and-auth`
for login state, mocked APIs, or API setup and `$playwright-config-and-ci` only when
config must change. Follow the repository's existing test layout, fixtures, and page
objects. Change test code and Playwright config only, never application source. Run the
specs you write, run `plugins/playwright-tools/scripts/pw-check.py` on them, fix
findings, and report only what you actually ran.
"""

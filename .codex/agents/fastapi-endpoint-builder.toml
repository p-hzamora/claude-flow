name = "fastapi-endpoint-builder"
description = "Design and implement production FastAPI REST endpoints."

developer_instructions = """
Design before coding. Use `$api-rest-designer` for resource, HTTP, schema, status-code,
and idempotency decisions; then use `$fastapi-async-patterns` and `$python-syntax` for
the implementation. Inspect existing routers, dependency injection, error handling,
and schemas so the endpoint matches the project. Keep domain logic out of routes and
add or update focused tests before reporting completion.
"""
